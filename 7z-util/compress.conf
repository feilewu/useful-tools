# 7Z 视频压缩工具配置文件

# 源目录 (输入目录)
SOURCE_DIR=./source

# 目标目录 (输出目录)
DEST_DIR=./compressed

# 是否启用加密 (true/false)
ENCRYPTION_ENABLED=false

# 加密密码 (仅在启用加密时使用)
ENCRYPTION_PASSWORD=your_password_here

# 包含的文件扩展名 (以空格分隔)
INCLUDE_EXTENSIONS="mp4 avi mkv mov wmv flv webm m4v mpg mpeg 3gp ogv"

# 排除的文件扩展名 (以空格分隔)
EXCLUDE_EXTENSIONS=""

# 7Z 压缩选项
COMPRESSION_METHOD=lzma2
COMPRESSION_LEVEL=9
SOLID_COMPRESSION=on

# 日志文件路径 (默认: 不记录日志)
# 如果设置，将记录压缩过程到指定文件
DEFAULT_LOG_FILE=./compress.log

# 是否启用随机文件名 (true/false)
# 启用后，压缩后的目标文件将使用随机名称，而不是原始文件名
# 适用于不希望压缩文件名与原始文件名对应的场景
RANDOM_NAME_ENABLED=false